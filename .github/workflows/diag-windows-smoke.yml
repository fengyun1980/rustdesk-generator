name: diag-windows-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag-windows-smoke.yml

jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ./dist
          run-id: 45000206984
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行客户端冒烟测试
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          cd dist

          Write-Host "===== --version via cmd ====="
          cmd /c ".\rustdesk.exe --version & echo EXITCODE=%ERRORLEVEL%"

          Write-Host "===== start UI ====="
          $p = Start-Process -FilePath .\rustdesk.exe -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
          }
          Write-Host "HasExited=$($p.HasExited)"
          if ($p.HasExited) {
            Write-Host "ExitCode=$($p.ExitCode)"
          }
          Write-Host "processes:"
          Get-Process | Where-Object { $_.ProcessName -like '*rustdesk*' -or $_.ProcessName -like '*RuntimeBroker*' } | Select-Object Id,ProcessName,MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "===== stdout ====="
          if (Test-Path out.txt) { Get-Content out.txt -Raw }
          Write-Host "===== stderr ====="
          if (Test-Path err.txt) { Get-Content err.txt -Raw }

          Write-Host "===== log ====="
          Get-ChildItem "$env:APPDATA\RDService\log\*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== LOG $($_.FullName) ====="
            Get-Content $_.FullName -Tail 120
          }

          Get-Process | Where-Object { $_.ProcessName -like '*rustdesk*' } | Stop-Process -Force -ErrorAction SilentlyContinue

name: diag-windows-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag-windows-smoke.yml

jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ./dist
          run-id: 45000206984
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行客户端冒烟测试
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          cd dist

          Write-Host "===== start UI ====="
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Join-Path $PWD 'rustdesk.exe')
          $psi.WorkingDirectory = $PWD.Path
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $exited = $proc.WaitForExit(20000)
          Write-Host "ExitedWithin20s=$exited"
          if ($exited) {
            Write-Host "ExitCode=$($proc.ExitCode)"
            Write-Host "===== stdout ====="
            Write-Host ($proc.StandardOutput.ReadToEnd())
            Write-Host "===== stderr ====="
            Write-Host ($proc.StandardError.ReadToEnd())
          }
          Write-Host "processes:"
          Get-Process | Where-Object { $_.ProcessName -like '*rustdesk*' } | Select-Object Id,ProcessName,MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "===== log ====="
          Get-ChildItem "$env:APPDATA\RDService\log\*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== LOG $($_.FullName) ====="
            Get-Content $_.FullName -Tail 120
          }

          Get-Process | Where-Object { $_.ProcessName -like '*rustdesk*' } | Stop-Process -Force -ErrorAction SilentlyContinue

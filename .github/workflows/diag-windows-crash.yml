name: diag-windows-crash
on:
  push:
    paths:
      - '.github/workflows/diag-windows-crash.yml'
permissions:
  actions: read
  contents: read

jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Download our built artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ours
          run-id: 45000206984
          repository: fengyun1980/rustdesk-generator
          github-token: ${{ github.token }}

      - name: Prepare and patch adapter key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\work | Out-Null
          Copy-Item -Recurse ours C:\work\default_adapter
          Copy-Item -Recurse ours C:\work\patched_adapter
          python -c "import sys;p=r'C:\work\patched_adapter\printer_driver_adapter.dll';d=open(p,'rb').read();o=b'5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=';n=b'BCjRiUpyTbnrEQC5BCVVaySF1dinRDvGtkCCzlZGbKg=';print('count',d.count(o));assert d.count(o)==1;open(p,'wb').write(d.replace(o,n));print('patched')"

      - name: Run matrix
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Kill-All {
            Get-Process rustdesk,RDService,MyApp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          function Run-Case([string]$label, [string]$dir) {
            Write-Host ""
            Write-Host "===================== CASE: $label ====================="
            Kill-All
            Start-Sleep -Seconds 1
            Remove-Item -Recurse -Force "$env:APPDATA\RDService", "$env:APPDATA\RustDesk", "$env:APPDATA\MyApp" -ErrorAction SilentlyContinue
            $out = "C:\work\$label.out.txt"; $err = "C:\work\$label.err.txt"
            $p = Start-Process -FilePath (Join-Path $dir 'rustdesk.exe') -WorkingDirectory $dir -ArgumentList @() `
                 -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            $exited = $p.WaitForExit(10000)
            Write-Host "ExitedWithin10s=$exited"
            if ($exited) { Write-Host "ExitCode=$($p.ExitCode)" }
            Write-Host "--- log grep ---"
            foreach ($d in "$env:APPDATA\RDService\log", "$env:APPDATA\RustDesk\log") {
              if (Test-Path "$d\rustdesk_rCURRENT.log") {
                Write-Host "[$d]"
                Select-String -Path "$d\rustdesk_rCURRENT.log" -Pattern 'printer|panic|custom' | ForEach-Object { Write-Host $_.Line }
              }
            }
            Kill-All
            Start-Sleep -Seconds 1
          }
          Run-Case '1_default_adapter' 'C:\work\default_adapter'
          Run-Case '2_patched_adapter' 'C:\work\patched_adapter'

name: diag-windows-crash
on:
  push:
    paths:
      - '.github/workflows/diag-windows-crash.yml'
permissions:
  actions: read
  contents: read

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - name: Download our built artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ours
          run-id: 45000206984
          repository: fengyun1980/rustdesk-generator
          github-token: ${{ github.token }}

      - name: Patch custom-client pubkey and generate signed configs
        shell: pwsh
        run: |
          python -m pip install --quiet cryptography
          @'
          import base64, json, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization

          priv = Ed25519PrivateKey.from_private_bytes(bytes.fromhex('5f' * 32))
          pub = priv.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          pub_b64 = base64.b64encode(pub).decode()
          old = b'BCjRiUpyTbnrEQC5BCVVaySF1dinRDvGtkCCzlZGbKg='
          assert len(pub_b64) == len(old)

          path = os.path.join('ours', 'librustdesk.dll')
          data = open(path, 'rb').read()
          cnt = data.count(old)
          print('pubkey occurrences in dll:', cnt)
          assert cnt == 1
          open(path, 'wb').write(data.replace(old, pub_b64.encode()))
          print('patched pubkey ->', pub_b64)

          app = 'RDService'
          settings = {
              'custom-rendezvous-server': 'rdc.tmnas.top:21116',
              'relay-server': 'rdc.tmnas.top:21117',
              'key': 'keoTlqSspoXJuqQ46hCilzq4tH9eYndrDhcbzOYn0k4=',
          }
          base = {'app-name': app, 'password': '@1979', 'salt': 'hCoXj4kjZHiUFq9V', 'conn-type': 'both'}
          variants = {
              '01_full': {**base, 'default-settings': settings},
              '02_app_only': {'app-name': app},
              '03_no_pwd': {**{k: v for k, v in base.items() if k not in ('password', 'salt')}, 'default-settings': settings},
              '04_no_settings': base,
              '05_server_only': {'app-name': app, 'default-settings': {'custom-rendezvous-server': settings['custom-rendezvous-server']}},
              '06_server_key': {'app-name': app, 'default-settings': {'custom-rendezvous-server': settings['custom-rendezvous-server'], 'key': settings['key']}},
              '07_no_key': {'app-name': app, 'default-settings': {'custom-rendezvous-server': settings['custom-rendezvous-server'], 'relay-server': settings['relay-server']}},
              '08_pwd_only': {'app-name': app, 'password': '@1979', 'salt': 'hCoXj4kjZHiUFq9V'},
          }
          os.makedirs('variants', exist_ok=True)
          for name, cfg in variants.items():
              body = json.dumps(cfg, separators=(',', ':')).encode()
              sig = priv.sign(body)
              open(os.path.join('variants', name + '.txt'), 'wb').write(base64.b64encode(sig + body))
              print(name, body.decode())
          '@ | Set-Content -Path gen.py -Encoding UTF8
          python gen.py

      - name: Run variant matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          function Show-EventLog($startTime) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startTime} -ErrorAction SilentlyContinue |
              Where-Object { $_.Id -in 1000,1001,1002,1026 } |
              ForEach-Object { Write-Host ("[{0}] Id={1} {2}`n{3}" -f $_.TimeCreated, $_.Id, $_.ProviderName, $_.Message) }
          }

          function Invoke-Case([string]$label, [string]$variant, [string[]]$extraArgs) {
            Write-Host ""
            Write-Host "===================== CASE: $label ====================="
            Get-Process rustdesk -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            Remove-Item -Recurse -Force "$env:APPDATA\RDService" -ErrorAction SilentlyContinue
            Copy-Item "variants\$variant.txt" "C:\work\ours\custom.txt" -Force
            $outPath = "C:\work\$label.out.txt"
            $errPath = "C:\work\$label.err.txt"
            $startTime = Get-Date
            $p = Start-Process -FilePath "C:\work\ours\rustdesk.exe" -WorkingDirectory "C:\work\ours" -ArgumentList $extraArgs `
                 -RedirectStandardOutput $outPath -RedirectStandardError $errPath -PassThru -NoNewWindow
            $exited = $p.WaitForExit(12000)
            Write-Host "ExitedWithin12s=$exited"
            if ($exited) { Write-Host "ExitCode=$($p.ExitCode)" }
            Start-Sleep -Seconds 1
            Get-Process rustdesk -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ("PROC pid={0} title='{1}'" -f $_.Id, $_.MainWindowTitle)
            }
            Write-Host "--- stdout ---"
            Get-Content $outPath -ErrorAction SilentlyContinue | Select-Object -First 3 | Write-Host
            Write-Host "--- stderr ---"
            Get-Content $errPath -ErrorAction SilentlyContinue | Write-Host
            Show-EventLog $startTime
            $log = "$env:APPDATA\RDService\log\rustdesk_rCURRENT.log"
            if (Test-Path $log) {
              Write-Host "--- rustdesk log tail ---"
              Get-Content $log -Tail 15 | Write-Host
            }
            Get-Process rustdesk -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }

          New-Item -ItemType Directory -Force C:\work | Out-Null
          Copy-Item -Recurse ours C:\work\ours -Force

          Invoke-Case '01_full' '01_full' @()
          Invoke-Case '02_app_only' '02_app_only' @()
          Invoke-Case '03_no_pwd' '03_no_pwd' @()
          Invoke-Case '04_no_settings' '04_no_settings' @()
          Invoke-Case '05_server_only' '05_server_only' @()
          Invoke-Case '06_server_key' '06_server_key' @()
          Invoke-Case '07_no_key' '07_no_key' @()
          Invoke-Case '08_pwd_only' '08_pwd_only' @()

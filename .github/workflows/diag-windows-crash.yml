name: diag-windows-crash
on:
  push:
    paths:
      - '.github/workflows/diag-windows-crash.yml'
permissions:
  actions: read
  contents: read

jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download our built artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ours
          run-id: 45000206984
          repository: fengyun1980/rustdesk-generator
          github-token: ${{ github.token }}

      - name: Prepare variants
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\work | Out-Null
          Get-ChildItem ours | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host
          Copy-Item -Recurse ours C:\work\withcustom
          Copy-Item -Recurse ours C:\work\nocustom
          Remove-Item C:\work\nocustom\custom.txt -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse ours C:\work\emptycustom
          Set-Content -Path C:\work\emptycustom\custom.txt -Value '' -NoNewline
          Copy-Item -Recurse ours C:\work\garbage
          Set-Content -Path C:\work\garbage\custom.txt -Value 'not-a-valid-config' -NoNewline
          Write-Host "custom.txt sizes:"
          foreach ($d in 'withcustom','nocustom','emptycustom','garbage') {
            $f = "C:\work\$d\custom.txt"
            if (Test-Path $f) { Write-Host "$d => $((Get-Item $f).Length) bytes" } else { Write-Host "$d => (no custom.txt)" }
          }

      - name: Run variant matrix
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Kill-All {
            Get-Process rustdesk,RDService,MyApp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          function Run-Case([string]$label, [string]$dir, [string[]]$args) {
            Write-Host ""
            Write-Host "===================== CASE: $label ====================="
            Kill-All
            Start-Sleep -Seconds 1
            Remove-Item -Recurse -Force "$env:APPDATA\RDService", "$env:APPDATA\RustDesk", "$env:APPDATA\MyApp" -ErrorAction SilentlyContinue
            $out = "C:\work\$label.out.txt"; $err = "C:\work\$label.err.txt"
            $p = Start-Process -FilePath (Join-Path $dir 'rustdesk.exe') -WorkingDirectory $dir -ArgumentList $args `
                 -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            $exited = $p.WaitForExit(8000)
            Write-Host "ExitedWithin8s=$exited"
            if ($exited) { Write-Host "ExitCode=$($p.ExitCode)" }
            Write-Host "--- stderr ---"; Get-Content $err -ErrorAction SilentlyContinue | Write-Host
            Write-Host "--- log tail ---"
            foreach ($d in "$env:APPDATA\RDService\log", "$env:APPDATA\RustDesk\log") {
              if (Test-Path "$d\rustdesk_rCURRENT.log") { Write-Host "[$d]"; Get-Content "$d\rustdesk_rCURRENT.log" -Tail 5 | Write-Host }
            }
            Kill-All
            Start-Sleep -Seconds 1
          }
          Run-Case 'nocustom' 'C:\work\nocustom' @()
          Run-Case 'emptycustom' 'C:\work\emptycustom' @()
          Run-Case 'garbage' 'C:\work\garbage' @()
          Run-Case 'withcustom' 'C:\work\withcustom' @()

      - name: Locate cdb
        shell: pwsh
        run: |
          $cands = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe'
          )
          $cdb = $null
          foreach ($c in $cands) { if (Test-Path $c) { $cdb = $c; break } }
          if (-not $cdb) { $cdb = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          Write-Host "CDB=$cdb"
          if ($cdb) { $cdb | Set-Content C:\work\cdbpath.txt }

      - name: Debug crash with cdb
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path C:\work\cdbpath.txt)) { Write-Host "no cdb, skip"; exit 0 }
          $cdb = Get-Content C:\work\cdbpath.txt
          @'
          .symfix
          .reload
          sxe -c "kb; ~*k; q" av
          bu KERNELBASE!ExitProcess "kb; ~*k; q"
          bu ucrtbase!abort "kb; ~*k; q"
          bu ucrtbase!exit "kb; ~*k; q"
          bu ucrtbase!_exit "kb; ~*k; q"
          g
          '@ | Set-Content C:\work\cdbcmds.txt -Encoding ASCII
          Get-Process rustdesk -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          Remove-Item -Recurse -Force "$env:APPDATA\RDService", "$env:APPDATA\RustDesk" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $cdb -ArgumentList @('-cf','C:\work\cdbcmds.txt','C:\work\withcustom\rustdesk.exe') `
               -WorkingDirectory 'C:\work\withcustom' -RedirectStandardOutput 'C:\work\cdb.out.txt' -RedirectStandardError 'C:\work\cdb.err.txt' -PassThru -NoNewWindow
          $done = $p.WaitForExit(120000)
          Write-Host "cdbDone=$done"
          if (-not $done) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "=========== CDB STDOUT ==========="
          Get-Content C:\work\cdb.out.txt -ErrorAction SilentlyContinue | Write-Host
          Write-Host "=========== CDB STDERR ==========="
          Get-Content C:\work\cdb.err.txt -ErrorAction SilentlyContinue | Write-Host

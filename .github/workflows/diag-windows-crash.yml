name: diag-windows-crash
on:
  push:
    paths:
      - '.github/workflows/diag-windows-crash.yml'
permissions:
  actions: read
  contents: read

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - name: Download our built artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ours
          run-id: 45000206984
          repository: fengyun1980/rustdesk-generator
          github-token: ${{ github.token }}

      - name: Prepare copies, extra signed variants, procdump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\work | Out-Null
          Copy-Item -Recurse ours C:\work\orig_base
          Copy-Item -Recurse ours C:\work\orig_renamed
          Rename-Item C:\work\orig_renamed\rustdesk.exe RDService.exe
          Copy-Item -Recurse ours C:\work\patched

          python -m pip install --quiet cryptography
          @'
          import base64, json, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization

          priv = Ed25519PrivateKey.from_private_bytes(bytes.fromhex('5f' * 32))
          pub = priv.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          pub_b64 = base64.b64encode(pub).decode()
          old = b'BCjRiUpyTbnrEQC5BCVVaySF1dinRDvGtkCCzlZGbKg='
          p = os.path.join('C:/work/patched', 'librustdesk.dll')
          data = open(p, 'rb').read()
          assert data.count(old) == 1
          open(p, 'wb').write(data.replace(old, pub_b64.encode()))

          cfg = {
              '09_appname_default': {'app-name': 'RustDesk'},
              '10_appname_other': {'app-name': 'MyApp'},
              '11_appname_rdservice': {'app-name': 'RDService'},
          }
          os.makedirs('C:/work/variants', exist_ok=True)
          for name, c in cfg.items():
              body = json.dumps(c, separators=(',', ':')).encode()
              open('C:/work/variants/' + name + '.txt', 'wb').write(base64.b64encode(priv.sign(body) + body))
          '@ | Set-Content -Path gen2.py -Encoding UTF8
          python gen2.py

          Invoke-WebRequest -Uri https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip -DestinationPath C:\procdump -Force
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\rustdesk.exe" /v DumpFolder /t REG_EXPAND_SZ /d "C:\dumps" /f | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\rustdesk.exe" /v DumpType /t REG_DWORD /d 2 /f | Out-Null
          New-Item -ItemType Directory -Force C:\dumps | Out-Null

      - name: Run cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Kill-All {
            Get-Process rustdesk,RDService,MyApp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          function Run-Case([string]$label, [string]$dir, [string]$exeName, [string[]]$args) {
            Write-Host ""
            Write-Host "===================== CASE: $label ====================="
            Kill-All
            Start-Sleep -Seconds 1
            Remove-Item -Recurse -Force "$env:APPDATA\RDService", "$env:APPDATA\RustDesk", "$env:APPDATA\MyApp" -ErrorAction SilentlyContinue
            $out = "C:\work\$label.out.txt"; $err = "C:\work\$label.err.txt"
            $p = Start-Process -FilePath (Join-Path $dir $exeName) -WorkingDirectory $dir -ArgumentList $args `
                 -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            $exited = $p.WaitForExit(12000)
            Write-Host "ExitedWithin12s=$exited"
            if ($exited) { Write-Host "ExitCode=$($p.ExitCode)" }
            Start-Sleep -Seconds 1
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -in @('rustdesk','RDService','MyApp') } | ForEach-Object {
              Write-Host ("PROC pid={0} name={1} title='{2}'" -f $_.Id, $_.ProcessName, $_.MainWindowTitle)
            }
            Write-Host "--- stderr ---"; Get-Content $err -ErrorAction SilentlyContinue | Write-Host
            Write-Host "--- log tails ---"
            foreach ($d in "$env:APPDATA\RDService\log", "$env:APPDATA\RustDesk\log", "$env:APPDATA\MyApp\log") {
              if (Test-Path "$d\rustdesk_rCURRENT.log") { Write-Host "[$d]"; Get-Content "$d\rustdesk_rCURRENT.log" -Tail 8 | Write-Host }
            }
            Write-Host "--- event log ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Id -in 1000,1001,1002,1026 } |
              ForEach-Object { Write-Host ("Id={0} {1}`n{2}" -f $_.Id, $_.ProviderName, $_.Message) }
            Kill-All
            Start-Sleep -Seconds 1
          }

          Run-Case 'A_renamed_exe' 'C:\work\orig_renamed' 'RDService.exe' @()
          Run-Case 'B_original_exe' 'C:\work\orig_base' 'rustdesk.exe' @()
          Copy-Item 'C:\work\variants\09_appname_default.txt' 'C:\work\patched\custom.txt' -Force
          Run-Case 'C_appname_default' 'C:\work\patched' 'rustdesk.exe' @()
          Copy-Item 'C:\work\variants\10_appname_other.txt' 'C:\work\patched\custom.txt' -Force
          Run-Case 'D_appname_other' 'C:\work\patched' 'rustdesk.exe' @()

          Write-Host ""
          Write-Host "===================== PROCDUMP: original ====================="
          Kill-All
          Remove-Item -Recurse -Force "$env:APPDATA\RDService" -ErrorAction SilentlyContinue
          & "C:\procdump\procdump64.exe" -accepteula -ma -e -t -x C:\dumps C:\work\orig_base\rustdesk.exe 2>&1 | Out-String | Write-Host
          Get-ChildItem C:\dumps -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Write-Host
          Kill-All

      - name: Upload dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: C:\dumps\*.dmp
          if-no-files-found: ignore
